[package]
name = "sipaling-cbt-lockdown"
version = "1.0.0"
description = "Aplikasi Ujian Terkunci — CBT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Hanya di Windows, dan hanya dua modul.
#
# Seluruh yang dibutuhkan dari Win32 adalah SetWindowDisplayAffinity beserta
# dua tetapannya. Menarik seluruh permukaan API Windows untuk satu panggilan
# akan menambah menit-menit ke setiap pembangunan tanpa satu pun kemampuan
# tambahan yang dipakai.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
